<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What To Bring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="assets/banner.png" alt="banner with text">
    </header>
    <main>
        <h1 class="wtb-title">What to bring?</h1>
        <section class="speech-bubble">
            <img src="assets/big-speech-bubble.png" alt="big speech bubble with text">
            <p>Are you prepared for the<br>Mini Marathon?</p>
        </section>
        <img class="cheeto-backpack" src="assets/cheeto-backpack.png" alt="cheeto with a backpack">

        <section class="options-container">
            <a href="shoes-selected.html" class="option-btn btn-shoes">
                <span class="btn-text">Good running shoes</span>
                <span class="status-circle"></span>
            </a>

            <a href="athletic-clothes-selected.html" class="option-btn btn-clothes">
                <span class="btn-text">Athletic Clothes</span>
                <span class="status-circle"></span>
            </a>

            <a href="warm-layer-selected.html" class="option-btn btn-warm">
                <span class="btn-text">Warm layer</span>
                <span class="status-circle"></span>
            </a>

            <a href="water-selected.html" class="option-btn btn-water">
                <span class="btn-text">Water</span>
                <span class="status-circle"></span>
            </a>
            <a href="snack-selected.html" class="option-btn btn-snack">
                <span class="btn-text">Yummy snack</span>
                <span class="status-circle"></span>
            </a>
        </section>
    </main>
</body>
</html>
