<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Aid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="first-aid-page">

<main class="aid-page-container">
    <!-- Map top section -->

    <div class="aid-page-map">
        <h1>Proceed to the first aid station to get basic medical attention.</h1>
        <img src="assets/map-health-page.png" alt="A map to the first aid station and an injured cat">
    </div>

<!-- Emergency Contact Section -->

    <div class="emergency-contact">
    <h2>For serious emergencies, please call:</h2>
    <img src="assets/emergancy-call.png" alt="Call 112" style="width:100%; height:auto;">
</div>

<!-- Provide Information Section -->

<div class="provide-information">
    <h3>Be ready to provide:</h3>

    <div class="information-icons">
        <img src="assets/location-marker.png" alt="A location marker">
        <p>Your exact location.</p>
    </div>

    <div class="information-icons">
        <img src="assets/clipboard.png" alt="A clipboard icon">
        <p>The nature of the emergency.</p>
    </div>
</div>

</main>

</body>
</html>
