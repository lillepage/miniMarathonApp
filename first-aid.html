<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Aid</title>
    <link rel="stylesheet" href="style.css">
</head>


<body class="first-aid-page">

 <!-- Header Banner -->

  <header>
    <div>
      <img src="assests/header/mini-logo.png" alt="Mini Marathon logo" id="mini-logo">
    </div>
    <div id="logo-text">
      <h2>Copenhagen <br> Mini Marathon</h2>
    </div>
  </header>

    <main class="aid-page-container">
    <!-- Map top section -->

    <div class="aid-page-map">
        <h1>Proceed to the first aid station to get basic medical attention.</h1>
        <img src="assests/map-first-aid.png" alt="A map to the first aid station and an injured cat">
    </div>

<!-- Emergency Contact Section -->

    <div class="emergency-contact">
    <h2>For serious emergencies, please call:</h2>
    <img src="assests/emergancy-call.png" alt="Call 112" style="width:100%; height:auto;">
    </div>

<!-- Provide Information Section -->

    <div class="provide-information">
    <h3>Be ready to provide:</h3>

    <div class="information-icons">
        <img src="assests/location-marker.png" alt="A location marker">
        <p>Your exact location.</p>
    </div>

    <div class="information-icons">
        <img src="assests/clipboard.png" alt="A clipboard icon">
        <p>The nature of the emergency.</p>
    </div>
    </div>

    </main>

<!-- Back Button -->

  <footer>
    <a href="index.html">
        <div id="back-button">
            <img src="assests/footer/back-button.png" alt="Back button"">
        </div>
    </a>
  </footer>

</body>
</html>
