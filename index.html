<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="style.css" rel="stylesheet">

  <title>Mini Marathon Home</title>
</head>
<body>

 <header>
    <div>
      <img src="assests/header/mini-logo.png" alt="Mini Marathon logo" id="mini-logo">
    </div>
    <div id="logo-text">
      <h2>Copenhagen <br> Mini Marathon</h2>
    </div>
    </div>
  </header>

  <main>
    <img src="assests/paper-texture-white.png">
    <!-- Countdown Text -->
      <h1 id="countdown"></h1>
    <!-- Cheeto and Phrase -->
     <div class="splash-card">
        <h2>Until Cheeto wakes up</h2>
        <img src="assests/cheetah-sleepy.png">
     </div>
     <!-- Race Times Dropdown -->
      <div>
        <div class="race-time-button">
          <img src="assests/race-times-button.png">
        </div>
        <!-- NEEDS FIX FOR COLLAPSE -->
        <!-- <div class="race-time-expand">
          <img src="assests/race-times-expand.png">
        </div> -->
      </div>

      <!-- Nav Cards -->
      <div class="nav">
        <div class="nav-container">
          <a href="what-to-bring.html"> <!-- Button Select for WTB -->
          <div class="nav-card" id="wtb-card">
            <img src="assests/cards/wtb-blue-card.png">
            <div class="nav-text" id="wtb-text">
              <h1>WHAT TO BRING</h1>
            </div>
          </div>
          </a>
          <a href="results.html"> <!-- Button Select for Results -->
          <div class="nav-card" id="results-card">         
            <img src="assests/cards/result-green-card.png">
            <div id="results-text">
              <h1>RESULTS</h1>
            </div>
          </div>
          </a>
          <a href="map-home.html"> <!-- Button Select for Map -->
          <div class="nav-card"  id="map-card">
            <img src="assests/cards/cheeto-map-card.png">
            <div id="map-text">
              <h1>MAP</h1>
            </div>
          </div>
          </a>
        </div>
      </div>
      <!-- Main Pages Footer Background -->
      <div class="main-footer-bg">
        <img src="assests/footer/cib_instagram.png">
        <div class="main-footer-bg-text">
          <h2>Want to see<br>
              pictures from<br>
              the Mini Marathon?
          </h2>
          <h3>Follow us on Instagram<br>@cphminmarathon</h3>
        </div>
      </div>
  </main>

  <footer>
    <div id="back-button">
        <img src="assests/footer/back-button.png" style="visibility: hidden;">
      </div>
    <div id="firstaid-button">
      <a href="first-aid.html">
      <img src="assests/footer/firstaid-button.png" alt="First aid button">
      </a>
    </div>
  </footer>
  
  <script src="script.js"></script>

</body>

</html>
