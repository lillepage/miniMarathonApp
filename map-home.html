<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="map-page">
<div class="map-container">
    <img src="assets/map-plain.png" alt="A map of fælledparken">
</div>

<nav class="icon-container">

    <div class="icons">
        <a href="map-startline.html">
        <img src="assets/icons/start-icon.png" alt="Race starting line">
        </a>
        <p>Starting Line</p>
    </div>

    <div class="icons">
        <a href="map-route.html">
        <img src="assets/icons/route-icon.png" alt="Race route">
        </a>
        <p>Race Route</p>
    </div>

    <div class="icons">
        <a href="map-bib.html">
        <img src="assets/icons/bib-icon.png" alt="Race bib collection point">
        </a>
        <p>Bib Collection</p>
    </div>

    <div class="icons">
        <a href="map-toilets.html">
        <img src="assets/icons/toilet-icon.png" alt="Toilet facilities">
        </a>
        <p>Toilet Facilities</p>
    </div>

    <div class="icons">
        <a href="map-food.html">
        <img src="assets/icons/food-icon.png" alt="Food and drink facilities">
        </a>
        <p>Food and Drink</p>
    </div>

    <div class="icons">
        <a href="map-metro.html">
        <img src="assets/icons/metro-icon.png" alt="Metro station">
        </a>
        <p>Metro Station</p>
    </div>

    <div class="icons">
        <a href="map-first-aid.html">
        <img src="assets/icons/first-aid-icon.png" alt="First aid station">
        </a>
        <p>First Aid Station</p>
    </div>

    <div class="icons">
        <a href="map-luggage.html">
        <img src="assets/icons/luggage-icon.png" alt="Luggage storage">
        </a>
        <p>Luggage Storage</p>
    </div>

</nav>

</body>
</html>
