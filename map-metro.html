<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map With Starting Line</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="map-page">

  <header>
    <div>
      <img src="assests/header/mini-logo.png" alt="Mini Marathon logo" id="mini-logo">
    </div>
    <div id="logo-text">
      <h2>Copenhagen <br> Mini Marathon</h2>
    </div>
  </header>

<div class="map-container">
    <img src="assests/map-metro-cheeto.png" alt="A map of fælledparken with the starting line highlighted">
</div>

<nav class="icon-container">

    <div class="icons">
        <a href="map-start-line.html">
        <img src="assests/icons/start-icon.png" alt="Race starting line">
        </a>
        <p>Starting Line</p>
    </div>

    <div class="icons">
        <a href="map-route.html">
        <img src="assests/icons/route-icon.png" alt="Race route">
        </a>
        <p>Race Route</p>
    </div>

    <div class="icons">
        <a href="map-bib.html">
        <img src="assests/icons/bib-icon.png" alt="Race bib collection point">
        </a>

    </div>

    <div class="icons">
        <a href="map-toilet.html">
        <img src="assests/icons/toilet-icon.png" alt="Toilet facilities">
        </a>

    <div class="icons">
        <a href="map-food.html">
        <img src="assests/icons/food-icon.png" alt="Food and drink facilities">
        </a>
        <p>Food and Drink</p>
    </div>

    <div class="icons">
        <a href="map-metro.html">
        <img src="assests/icons/metro-icon.png" alt="Metro station">
        </a>
        <p>Metro Station</p>
    </div>

    <div class="icons">
        <a href="map-first-aid.html">
        <img src="assests/icons/first-aid-icon.png" alt="First aid station">
        </a>
        <p>First Aid Station</p>
    </div>

    <div class="icons">
        <a href="map-luggage.html">
        <img src="assests/icons/luggage-icon.png" alt="Luggage storage">
        </a>
        <p>Luggage Storage</p>
    </div>

</nav>

  <footer>
     <div id="back-button">
        <a href="index.html">
        <img src="assests/footer/back-button.png" alt="Back button"">
      </a>
      </div>
    <div id="firstaid-button">
      <a href="first-aid.html">
      <img src="assests/footer/firstaid-button.png" alt="First aid button">
      </a>
    </div>
  </footer>

</html>
