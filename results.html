<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results page</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
    <div>
      <img src="assests/header/mini-logo.png" alt="Mini Marathon logo" id="mini-logo">
    </div>
    <div id="logo-text">
      <h2>Copenhagen <br> Mini Marathon</h2>
    </div>

  </header>
    <main class="sorry">
        <div class="card">
            <h3> Sorry, the results are not posted yet </h3>
            <img src="assests/cheetah-sleepy.png" alt="a picture of a sleepy cat">
            <h3> Please check again later.</h3>
        </div>

        <img src="assests/qr-code.png" alt="a qr code for our app">
        <p class="download" > Download our app to get all updates </p>
    </main>

    <footer>
    <div id="back-button">
        <a href="index.html">
        <img src="assests/footer/back-button.png" alt="Back button"">
      </a>
      </div>
    <div id="firstaid-button">
      <a href="first-aid.html">
      <img src="assests/footer/firstaid-button.png" alt="First aid button">
      </a>
    </div>
  </footer>
</body>
</html>
