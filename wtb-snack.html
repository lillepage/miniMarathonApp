<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What To Bring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div>
      <img src="assests/header/mini-logo.png" alt="Mini Marathon logo" id="mini-logo">
    </div>
    <div id="logo-text">
      <h2>Copenhagen <br> Mini Marathon</h2>
    </div>

  </header>

    <main>
        <h1 class="wtb-title">What to bring?</h1>
        <section class="speech-bubble">
            <img src="assests/big-speech-bubble.png" alt="big speech bubble with text">
            <p>Are you prepared for the<br>Mini Marathon?</p>
        </section>
        <img class="cheeto-backpack" src="assests/cheeto-everything.png" alt="cheeto with a backpack">

        <section class="options-container">
            <a href="wtb-shoes.html" class="option-btn btn-shoes">
                <span class="btn-text">Good running shoes</span>
                <img class="selector" src="assests/scribble-on-toggle.png" alt="shoes selector">
            </a>

            <a href="wtb-athletic.html" class="option-btn btn-clothes">
                <span class="btn-text">Athletic Clothes</span>
               <img class="selector" src="assests/scribble-on-toggle.png" alt="shoes selector">
            </a>

            <a href="wtb-warm-layer.html" class="option-btn btn-warm">
                <span class="btn-text">Warm layer</span>
                <img class="selector" src="assests/scribble-on-toggle.png" alt="shoes selector">
            </a>

            <a href="wtb-water.html" class="option-btn btn-water">
                <span class="btn-text">Water</span>
                <img class="selector" src="assests/scribble-on-toggle.png" alt="shoes selector">
            </a>
            <a href="wtb-snack.html" class="option-btn btn-snack">
                <span class="btn-text">Yummy snack</span>
                <img class="selector" src="assests/scribble-on-toggle.png" alt="shoes selector">
            </a>
        </section>
    </main>

   <footer>
    <div id="back-button">
        <a href="index.html">
        <img src="assests/footer/back-button.png" alt="Back button"">
      </a>
      </div>
    <div id="firstaid-button">
      <a href="first-aid.html">
      <img src="assests/footer/firstaid-button.png" alt="First aid button">
      </a>
    </div>
  </footer>

</body>
</html>
